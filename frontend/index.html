<!doctype html>
<html lang="zh-Hant-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>練習專案骨架</title>
    <!-- 先載入執行環境的設定（API 位址、環境、版本）：開發時由 Vite 提供，Staging 由後端提供 -->
    <script src="/config.js" vite-ignore></script>
    <style>
      :root {
        font-family: system-ui, -apple-system, 'Segoe UI', 'PingFang TC', 'Microsoft JhengHei', 'Noto Sans TC', sans-serif;
        line-height: 1.6;
        color: #1f2933;
        background: #f5f6f8;
      }
      * { box-sizing: border-box; }
      body { margin: 0; }
      /* 頁面不夠長時，版本也在畫面最下面；頁面長的時候跟在內容後面，不會蓋住內容 */
      #root { display: flex; flex-direction: column; min-height: 100vh; min-height: 100dvh; }
      a { color: #1d4ed8; }
      button {
        font: inherit;
        padding: 8px 14px;
        border: 1px solid #c5cbd3;
        border-radius: 6px;
        background: #fff;
        color: inherit;
        cursor: pointer;
      }
      button:disabled { opacity: 0.6; cursor: default; }
      .env-banner { padding: 6px 16px; background: #b45309; color: #fff; font-weight: 600; text-align: center; }
      .topbar {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 8px 16px;
        padding: 12px 16px;
        background: #fff;
        border-bottom: 1px solid #e3e6ea;
      }
      .brand { font-weight: 700; color: inherit; text-decoration: none; }
      .account { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 6px; }
      main { flex: 1 0 auto; width: 100%; max-width: 720px; margin: 0 auto; padding: 24px 16px; }
      h1 { margin: 0 0 16px; font-size: 1.5rem; line-height: 1.3; }
      .status { display: grid; gap: 8px; margin: 0; padding: 0; list-style: none; }
      .status li { padding: 12px 16px; background: #fff; border: 1px solid #e3e6ea; border-radius: 8px; font-size: 1.1rem; }
      .ok { color: #047857; }
      .bad { color: #b91c1c; }
      .unknown { color: #6b7280; }
      .hint { color: #4b5563; }
      .error { color: #b91c1c; }
      .narrow { max-width: 420px; }
      .form { display: grid; gap: 16px; margin: 0; }
      .form label { display: grid; gap: 6px; font-weight: 600; }
      .form .hint { font-weight: 400; font-size: 0.9rem; }
      input {
        width: 100%;
        min-width: 0;
        font: inherit;
        font-size: 16px; /* 16px 以上，iPhone 點輸入框時不會自動放大畫面 */
        font-weight: 400;
        padding: 10px 12px;
        border: 1px solid #c5cbd3;
        border-radius: 6px;
        background: #fff;
        color: inherit;
      }
      input:focus { outline: 2px solid #1d4ed8; outline-offset: 1px; }
      .form p { margin: 0; }
      button.primary { padding: 12px 16px; border-color: #1d4ed8; background: #1d4ed8; color: #fff; font-weight: 600; }
      .link-button { padding: 0; border: 0; background: none; color: #1d4ed8; text-decoration: underline; }
      .separator { color: #9aa1ab; }
      .user-name { overflow-wrap: anywhere; }
      .version { width: 100%; max-width: 720px; margin: 0 auto; padding: 8px 16px 12px; text-align: right; font-size: 0.85rem; color: #6b7280; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
